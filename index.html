<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>المدينة إكسبرس | AL MADINA EXPRESS</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

  <div class="logo">
    🍽️ المدينة إكسبرس
    <small>AL MADINA EXPRESS • N'DJAMENA</small>
  </div>

  <button class="language" onclick="changeLanguage()">
    Français
  </button>

</header>


<section class="hero">

  <div>

    <h1 id="title">
      طعامك المفضل أينما كنت
    </h1>

    <p id="description">
      اطلب وجبتك بسهولة واستمتع بطعم المدينة إكسبرس.
    </p>

    <button onclick="scrollToMenu()" id="menuButton">
      تصفح القائمة
    </button>

  </div>

</section>


<section class="section" id="menu">

  <h2 id="menuTitle">
    🍴 قائمة الطعام
  </h2>


  <div class="categories">

    <button class="category active">
      الكل
    </button>

    <button class="category">
      🍔 الوجبات
    </button>

    <button class="category">
      🍗 الدجاج
    </button>

    <button class="category">
      🍕 البيتزا
    </button>

    <button class="category">
      🥤 المشروبات
    </button>

  </div>


  <div class="products">


    <div class="product">

      <div class="food-image">
        🍔
      </div>

      <div class="product-info">

        <h3>
          برغر المدينة
        </h3>

        <div class="price">
          3,500 FCFA
        </div>

        <button class="add" onclick="addToCart()">
          أضف للسلة
        </button>

      </div>

    </div>



    <div class="product">

      <div class="food-image">
        🍗
      </div>

      <div class="product-info">

        <h3>
          دجاج مشوي
        </h3>

        <div class="price">
          4,500 FCFA
        </div>

        <button class="add" onclick="addToCart()">
          أضف للسلة
        </button>

      </div>

    </div>



    <div class="product">

      <div class="food-image">
        🍕
      </div>

      <div class="product-info">

        <h3>
          بيتزا المدينة
        </h3>

        <div class="price">
          5,000 FCFA
        </div>

        <button class="add" onclick="addToCart()">
          أضف للسلة
        </button>

      </div>

    </div>



    <div class="product">

      <div class="food-image">
        🥤
      </div>

      <div class="product-info">

        <h3>
          مشروب غازي
        </h3>

        <div class="price">
          1,000 FCFA
        </div>

        <button class="add" onclick="addToCart()">
          أضف للسلة
        </button>

      </div>

    </div>


  </div>

</section>


<button class="cart" onclick="showCart()">

  🛒

  <span class="cart-count" id="cartCount">
    0
  </span>

</button>



<script>

let cart = 0;

let french = false;


function addToCart() {

  cart++;

  document.getElementById("cartCount").innerText = cart;

  alert(
    french
    ? "Produit ajouté au panier !"
    : "تمت إضافة المنتج إلى السلة!"
  );

}


function showCart() {

  alert(
    french
    ? "Votre panier contient " + cart + " article(s)."
    : "السلة تحتوي على " + cart + " منتج."
  );

}


function scrollToMenu() {

  document
    .getElementById("menu")
    .scrollIntoView({
      behavior: "smooth"
    });

}


function changeLanguage() {

  french = !french;


  if (french) {

    document.documentElement.lang = "fr";

    document.documentElement.dir = "ltr";


    document.getElementById("title").innerText =
      "Vos plats préférés où que vous soyez";


    document.getElementById("description").innerText =
      "Commandez facilement et profitez du goût de AL MADINA EXPRESS.";


    document.getElementById("menuButton").innerText =
      "Voir le menu";


    document.getElementById("menuTitle").innerText =
      "🍴 Notre menu";


    document.querySelector(".language").innerText =
      "العربية";


    document.querySelectorAll(".category")[0].innerText =
      "Tout";


    document.querySelectorAll(".category")[1].innerText =
      "🍔 Menus";


    document.querySelectorAll(".category")[2].innerText =
      "🍗 Poulet";


    document.querySelectorAll(".category")[3].innerText =
      "🍕 Pizza";


    document.querySelectorAll(".category")[4].innerText =
      "🥤 Boissons";

  }


  else {

    document.documentElement.lang = "ar";

    document.documentElement.dir = "rtl";


    document.getElementById("title").innerText =
      "طعامك المفضل أينما كنت";


    document.getElementById("description").innerText =
      "اطلب وجبتك بسهولة واستمتع بطعم المدينة إكسبرس.";


    document.getElementById("menuButton").innerText =
      "تصفح القائمة";


    document.getElementById("menuTitle").innerText =
      "🍴 قائمة الطعام";


    document.querySelector(".language").innerText =
      "Français";


    document.querySelectorAll(".category")[0].innerText =
      "الكل";


    document.querySelectorAll(".category")[1].innerText =
      "🍔 الوجبات";


    document.querySelectorAll(".category")[2].innerText =
      "🍗 الدجاج";


    document.querySelectorAll(".category")[3].innerText =
      "🍕 البيتزا";


    document.querySelectorAll(".category")[4].innerText =
      "🥤 المشروبات";

  }

}

</script>

</body>
</html>
